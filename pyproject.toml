[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidenceops"
version = "0.1.0"
description = "Evidence-grounded compliance and RFP questionnaire agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EvidenceOps" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "strands-agents[openai]>=1.51,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
evidenceops = "evidenceops.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidenceops"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "evidenceops/web"
"examples" = "evidenceops/examples"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["evidenceops"]
branch = true
